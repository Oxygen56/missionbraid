name: Bug report
description: Report a reproducible problem in MissionBraid
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve MissionBraid. Remove credentials and private repository content before submitting traces or evidence.
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Describe the observed behavior and the user-visible impact.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Include the smallest sequence that reproduces the problem, using a disposable workspace when possible.
      placeholder: |
        1. Start MissionBraid with ...
        2. Create a Mission with ...
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime path
      options:
        - Codex
        - Qoder
        - Claude Code
        - Public external Adapter
        - Workbench or Mission Kernel only
        - Other or unknown
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MissionBraid revision
      description: Commit SHA or source revision, if known.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, pnpm version, and Runtime version. Do not include credentials.
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Add relevant errors, event excerpts, or screenshots after removing secrets and private content.
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched existing issues for the same problem.
          required: true
        - label: I removed credentials, tokens, and private repository content.
          required: true
